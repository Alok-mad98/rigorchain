<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search</title>
    <link rel="stylesheet" href="/compliance.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      .muted { color: #bbb; font-size: 12px; }
      a { color: #fff; }
      input { font-family: ui-monospace, monospace; padding: 8px; width: min(100%, 520px); }
      .error { color: #ff6b6b; margin-top: 12px; }
    </style>
    <script src="/explorer-routes.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/address">Address</a>
      <a href="/search">Search</a>
    </nav>
    <h1>Search</h1>
    <p class="muted">Block height, block hash, txid, or address. wtxid is informational only — search the canonical txid.</p>
    <form id="form" method="get" action="/search">
      <p>
        <input id="q" name="q" placeholder="height, txid, block hash, or address" autocomplete="off" />
        <button type="submit">Go</button>
      </p>
    </form>
    <p id="error" class="error" hidden></p>
    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) {
        const el = document.getElementById('error');
        el.textContent = err;
        el.hidden = false;
      }
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
