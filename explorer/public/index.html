<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIGOR Explorer MVP (closed testnet)</title>
    <link rel="stylesheet" href="/compliance.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; }
      .row { margin-top: 10px; }
      a { margin-right: 12px; }
      table { border-collapse: collapse; width: 100%; max-width: 1100px; }
      th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
      th { background: #f6f6f6; }
      .muted { color: #666; font-size: 12px; }
    </style>
    <script src="/explorer-routes.js"></script>
  </head>
  <body>
    <h1>RIGOR Explorer MVP (closed testnet)</h1>
    <div id="nav" class="row"></div>

    <p class="muted">
      This UI is non-authoritative: it mirrors NODE-C RPC output stored by the indexer. During reorg drills, blocks may be truncated and re-imported.
    </p>

    <h2>Chain tip</h2>
    <pre id="tip" class="muted"></pre>

    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      async function loadTip() {
        const r = await fetch('/api/chain/tip');
        const j = await r.json();
        document.getElementById('tip').textContent = JSON.stringify(j, null, 2);
      }
      loadTip().catch((e) => {
        document.getElementById('tip').textContent = 'Failed: ' + String(e);
      });
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
