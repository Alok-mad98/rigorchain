<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latest blocks</title>
    <link rel="stylesheet" href="/compliance.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      a { color: #fff; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #333; padding: 8px; font-size: 13px; }
      th { background: #111; }
      .muted { color: #bbb; font-size: 12px; }
      .blocks-pager { margin: 8px 0 12px; }
      .blocks-pager a { margin-right: 8px; }
      @media (max-width: 800px) { .fp-col { display: none; } }
    </style>
    <script src="/explorer-routes.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/search">Search</a>
    </nav>
    <h1>Latest blocks</h1>

    <div id="root">Loading...</div>

    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      function shortHash(h) {
        if (!h) return '';
        return String(h).slice(0, 12) + '…' + String(h).slice(-6);
      }

      async function load() {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page') || '1';
        const r = await ExplorerRoutes.fetchJson('/api/blocks?limit=50&page=' + encodeURIComponent(page));
        const j = await r.json();
        const rows = (j.blocks || []);
        const pagerHtml = (function () {
          const cur = Number(j.page || 1);
          const pages = Number(j.pages || 1);
          const total = Number(j.total || rows.length);
          const parts = ['Page ' + cur + ' / ' + pages + ' · ' + total + ' blocks'];
          if (j.has_prev) parts.push('<a href="/blocks?page=' + (cur - 1) + '">Newer</a>');
          if (j.has_next) parts.push('<a href="/blocks?page=' + (cur + 1) + '">Older</a>');
          return '<p class="muted blocks-pager">' + parts.join(' · ') + '</p>';
        })();

        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>height</th>
              <th>hash</th>
              <th>time</th>
              <th>tx_count</th>
              <th>oru_minted</th>
              <th>res_minted</th>
              <th>converge_destroy</th>
            </tr>
          </thead>
        `;

        const tbody = document.createElement('tbody');
        for (const b of rows) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${b.height}</td>
            <td><a href="${ExplorerRoutes.blockPath(b.block_hash)}">${shortHash(b.block_hash)}</a></td>
            <td>${ExplorerRoutes.timeCellHtml(b.time)}</td>
            <td>${b.tx_count}</td>
            <td>${b.oru_minted_display ?? b.oru_minted ?? "—"}</td>
            <td>${b.res_minted_display ?? "—"}</td>
            <td>${b.converge_burn_display ?? "—"}</td>
          `;
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        const el = document.getElementById('root');
        el.innerHTML = pagerHtml;
        el.appendChild(table);
        el.insertAdjacentHTML('beforeend', pagerHtml);
      }

      const params = new URLSearchParams(window.location.search);
      const ssrRoot = document.getElementById('root');
      if (ssrRoot && ssrRoot.getAttribute('data-ssr') === '1' && !params.get('page')) {
        /* first page already filled */
      } else {
        load().catch((e) => {
          document.getElementById('root').textContent = 'Failed: ' + String(e);
        });
      }
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
