# RIGOR explorer TLS reverse proxy.
# Public hostname reserved: explorer.rigorchain.com
# Do not enable this vhost until EXPLORER_PRODUCTION_GATE.md G6 (testnet import) is checked
# and DNS is intentionally pointed at this host.

limit_req_zone $binary_remote_addr zone=explorer_global:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=explorer_api_heavy:10m rate=60r/m;

map $http_origin $cors_origin {
    default "";
    "~^https://(explorer|wallet)\.rigorchain\.com$" $http_origin;
}

upstream explorer_indexer {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream wallet_observer {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name explorer.rigorchain.com;

    ssl_certificate     /etc/letsencrypt/live/explorer.rigorchain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.rigorchain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=explorer_global burst=40 nodelay;
        proxy_pass http://explorer_indexer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/|tx/|block/|address/|healthz|compliance) {
        limit_req zone=explorer_api_heavy burst=20 nodelay;
        proxy_pass http://explorer_indexer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
        }
    }
}

server {
    listen 443 ssl http2;
    server_name wallet.example.com;

    ssl_certificate     /etc/letsencrypt/live/wallet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        limit_req zone=explorer_global burst=30 nodelay;
        proxy_pass http://wallet_observer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        }
    }
}

server {
    listen 80;
    server_name explorer.rigorchain.com;
    return 301 https://$host$request_uri;
}
