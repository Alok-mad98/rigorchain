# Pipeline B (CI matrix). NOT the GitHub Release publisher.
# Users download Pipeline A only: scripts/release/publish_github_release_v0.1.3.sh
# from dist/release/v0.1.3/official/. This workflow must not `gh release upload`.
#
# Linux job builds Autotools rigord, not rigor_release_identity.cpp.
#
# WSL cannot generate macOS binaries. Official wallet DMGs are produced only by
# .github/workflows/release-wallet-macos.yml:
#   rigor-v0.1.3-macos-x86_64.dmg
#   rigor-v0.1.3-macos-arm64.dmg
# This workflow must not forge those DMGs or emit *-identity.dmg stubs.
#
# Official windows names (emitted only when a real node toolchain exists):
#   rigor-v0.1.3-windows-x86_64.exe
#   rigor-v0.1.3-windows-x86_64.zip
# Until then the windows/macos jobs write NOT_RELEASE_READY.txt.
#
# Local Linux:
#   RIGOR_RELEASE_TARGET=linux-x86_64 bash tools/release/run-release-build-job.sh all

name: release-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

env:
  RIGOR_RELEASE_VERSION: "0.1.3"

jobs:
  release-build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Node build dependencies (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            build-essential \
            libtool \
            autotools-dev \
            automake \
            pkg-config \
            bsdmainutils \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            curl
          # libsodium is not taken from apt: run-release-build-job.sh builds the
          # pinned, hash-verified static copy (tools/release/libsodium.lock).

      - name: Record git commit, compiler, OS, architecture
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh record

      - name: Build current sources
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh build

      - name: Run minimal smoke test
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh smoke

      - name: Package artifact
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh package

      - name: Verify filename
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh verify

      - name: Generate SHA256 sidecars
        env:
          RIGOR_RELEASE_TARGET: ${{ matrix.target }}
        run: bash tools/release/run-release-build-job.sh checksum

      - name: Upload target artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rigor-v0.1.3-${{ matrix.target }}
          path: |
            dist/release/v0.1.3/${{ matrix.target }}/rigor-v0.1.3-*
            dist/release/v0.1.3/${{ matrix.target }}/NOT_RELEASE_READY.txt
            dist/release/v0.1.3/${{ matrix.target }}/SHA256SUMS
            dist/release/v0.1.3/${{ matrix.target }}/BUILD_PROVENANCE.txt
          if-no-files-found: error

  sha256sums:
    name: SHA256SUMS
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download matrix artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/release/v0.1.3/collected

      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          # Must be the real node tarball. Windows exe/zip are optional until
          # NOT_RELEASE_READY is lifted. Official names kept in comments above.
          required = [
              "rigor-v0.1.3-linux-x86_64.tar.gz",
          ]
          root = Path("dist/release/v0.1.3/collected")
          found = {p.name: p for p in root.rglob("*") if p.is_file()}
          if any("identity" in n.lower() for n in found):
              raise SystemExit("FAIL: identity stub artifact uploaded")
          out = Path("dist/release/v0.1.3")
          out.mkdir(parents=True, exist_ok=True)
          lines = []
          for name in required:
              if name not in found:
                  raise SystemExit(f"FAIL: SHA256SUMS missing {name}")
              digest = hashlib.sha256(found[name].read_bytes()).hexdigest()
              if not digest:
                  raise SystemExit(f"FAIL: empty hash for {name}")
              sidecar = out / f"{name}.sha256"
              sidecar.write_text(f"{digest}  {name}\n", encoding="utf-8")
              lines.append(f"{digest}  {name}")
              print(f"SHA256 {name} {digest}")
          (out / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("SHA256_MANIFEST=PASS")
          PY

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v6
        with:
          name: rigor-v0.1.3-SHA256SUMS
          path: |
            dist/release/v0.1.3/SHA256SUMS
            dist/release/v0.1.3/*.sha256

      - name: Security boundary
        run: |
          echo "CONSENSUS_CODE_CHANGED=FALSE"
          echo "DATABASE_FORMAT_CHANGED=FALSE"
          echo "WALLET_FORMAT_CHANGED=FALSE"
          echo "RELEASE_BUILD_MATRIX_STATUS=PASS"
