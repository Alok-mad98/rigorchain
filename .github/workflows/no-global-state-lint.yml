# No-global-state guardrail (W1 / W5 / W11)
#
# Fails the PR if gArgs, SetRigorResEvalContext, or a non-allowlisted
# m_chain_res_mint_total read appears under core/src/script/ or
# core/src/consensus/. Does not build bitcoind.

name: no-global-state-lint

on:
  pull_request:
    paths:
      - "core/src/script/**"
      - "core/src/consensus/**"
      - "core/src/consensus_rigor/**"
      - "core/src/connect_block_rigor_checks.cpp"
      - "core/src/node/devtest_res_bootstrap.cpp"
      - "core/src/node/devtest_res_bootstrap.h"
      - "core/test/lint/lint-no-global-state.py"
      - ".github/workflows/no-global-state-lint.yml"
  push:
    paths:
      - "core/src/script/**"
      - "core/src/consensus/**"
      - "core/src/consensus_rigor/**"
      - "core/src/connect_block_rigor_checks.cpp"
      - "core/src/node/devtest_res_bootstrap.cpp"
      - "core/src/node/devtest_res_bootstrap.h"
      - "core/test/lint/lint-no-global-state.py"
      - ".github/workflows/no-global-state-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: CI environment preflight
        run: bash tools/ci/ci-environment-preflight.sh
      - name: CI reproducibility
        run: bash tools/ci/print-reproducibility.sh
      - name: No-global-state identifier scan
        run: python3 core/test/lint/lint-no-global-state.py
      - name: Optional tree-sitter AST scan
        continue-on-error: true
        run: |
          pip install tree-sitter tree-sitter-cpp
          python3 core/test/lint/lint-no-global-state.py
      - name: CI status
        if: success()
        run: echo "CI_STATUS=PASS"
