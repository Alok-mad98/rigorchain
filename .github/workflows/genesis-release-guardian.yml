# P0-082: Genesis Release Guardian — unique pre-mainnet release gate.
# CI / audit automation only. Does not modify consensus implementation.
# Fail: RIGOR_RELEASE_BLOCKED
# Reproduce locally: bash tools/run-genesis-release-guardian.sh

name: genesis-release-guardian

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-build:
    uses: ./.github/workflows/release-build.yml
  release-guardian:
    needs:
      - release-build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Require release-build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/release/v0.1.3/from-build
      - name: Fail closed if linux artifact missing
        run: |
          set -euo pipefail
          found="$(find dist/release/v0.1.3/from-build -type f -name 'rigor-v0.1.3-linux-x86_64.tar.gz' | head -n1)"
          [[ -n "${found}" ]] || {
            echo "FAIL: Guardian cannot pass without release-build artifacts"
            echo "RIGOR_RELEASE_BLOCKED"
            exit 1
          }
          echo "RELEASE_BUILD_ARTIFACTS=PRESENT"
          echo "linux_artifact=${found}"
      - name: CI environment preflight
        run: bash tools/ci/ci-environment-preflight.sh
      - name: C++ compiler and node build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            build-essential \
            libtool \
            autotools-dev \
            automake \
            pkg-config \
            bsdmainutils \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            libsodium-dev
      - name: Setup pinned Coq 8.15.0
        uses: ./.github/actions/setup-coq
      # Produce gitignored core/src/rigord on a clean runner. Guardian is
      # unchanged: Stage DATABASE_SECURITY still fail-closes on missing/stale
      # binary. Do not skip that check. See tools/ci/build-ci-rigord.sh and
      # docs/release/RIGOR_V0.1.3_CI_AUTHORITY_P0_093.md.
      - name: Build in-tree core/src/rigord
        run: bash tools/ci/build-ci-rigord.sh
      # Stage DATABASE_SECURITY (P0-091) is executed by the orchestrator via
      # tools/run-database-security-guardian-stage.sh. It runs
      # tools/run-production-reindex-reconstruction-audit.sh and
      # tools/run-wallet-sqlite-audit.sh and requires
      # PRODUCTION_FULL_REINDEX=PASS and WALLET_SQLITE_AUDIT_STATUS=CLOSED.
      # Needs in-tree core/src/rigord matching wallet / CoinsDB sources.
      - name: Genesis Release Guardian (all stages)
        run: bash tools/run-genesis-release-guardian.sh
      - name: Upload release guardian manifest
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-guardian-manifest
          path: release/release_guardian_manifest.json
      - name: Release blocked
        if: failure()
        run: |
          echo "RIGOR_RELEASE_BLOCKED"
          echo "GENESIS_RELEASE_GUARDIAN=FAIL"
          exit 1
