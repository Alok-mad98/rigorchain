[package]
name = "winner-engine"
version = "0.1.0"
edition = "2021"
description = "Production Winner Engine — convergence draw replay and mint authorization (TASK-MINING-016)"
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["rigor-pool-pg/postgres", "dep:log", "dep:postgres"]

[dependencies]
block-assembler = { path = "../block-assembler" }
rigor-convergence-root = { path = "../rigor-convergence-root" }
hex = "0.4"
rigor-gbt = { path = "../rigor-gbt" }
rigor-pool-pg = { path = "../rigor-pool-pg" }
log = { version = "0.4", optional = true }
postgres = { version = "0.19", optional = true, features = [
    "with-uuid-1",
    "with-serde_json-1",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
rigor-pool-metrics = { path = "../shared/metrics" }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
block-assembler = { path = "../block-assembler" }
rigor-gbt = { path = "../rigor-gbt" }
serde_json = "1.0"
