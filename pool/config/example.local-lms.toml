# Point pool at the local LMS Node-0 already running on this machine.
# RPC: 127.0.0.1:27811  user/pass: lmsim / lmsim-local-only
#
# Terminal A (stop any old pool on :3333 first with Ctrl+C):
#   ./dist/alpha/pool/linux/bin/rigor-pool --config pool/config/example.local-lms.toml run
#
# Terminal B:
#   ./dist/alpha/pool/linux/bin/rigor-miner-agent --pool 127.0.0.1:3333 --worker alice.rig1 --password x
#   ./dist/alpha/pool/linux/bin/rigor-pool --config pool/config/example.local-lms.toml status

[node]
rpc_host = "127.0.0.1"
rpc_port = 27811
rpc_user = "lmsim"
rpc_password = "lmsim-local-only"

[stratum]
listen_address = "127.0.0.1"
listen_port = 3333

[payout]
ORU_fee_percent = 1.0
payout_interval = 3600
pplns_window = 1

[database]
enabled = false

[security]
profile = "devtest"

[status]
interval_secs = 5
file = ".runtime/pool-pilot/status.json"
