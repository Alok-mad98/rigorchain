[package]
name = "rigor-gbt"
version = "0.1.0"
edition = "2021"
description = "RIGOR pool stack GBT adapter and template cache "
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["rigor-pool-pg/postgres"]

[dependencies]
hex = "0.4"
rigor-pool-pg = { path = "../rigor-pool-pg" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
