[package]
name = "rigor-pool-pilot"
version = "0.1.0"
edition = "2021"
description = "Closed testnet pilot harness for the RIGOR pool stack (TASK-MINING-010)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rigor-pool-pilot"
path = "src/main.rs"

[features]
default = []
postgres = ["rigor-pool-pg/postgres"]

[dependencies]
block-assembler = { path = "../block-assembler" }
rigor-pool-pg = { path = "../rigor-pool-pg" }
hex = "0.4"
mint-engine = { path = "../mint-engine" }
rigor-gbt = { path = "../rigor-gbt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
share-validator = { path = "../share-validator" }
stratum-server = { path = "../stratum-server" }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
