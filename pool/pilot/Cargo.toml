[package]
name = "rigor-pool-pilot"
version = "0.1.0"
edition = "2021"
description = "Alpha / closed-testnet ORU-only RIGOR mining pool (TASK-POOL-ALPHA-PRODUCT-READINESS-001)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rigor-pool"
path = "src/main.rs"
# Compatibility name `rigor-pool-pilot` is installed as a copy/symlink by
# scripts/alpha/build_alpha_pool.sh (avoids Cargo dual-bin warning on same main.rs).

[features]
default = []
postgres = ["rigor-pool-pg/postgres"]

[dependencies]
block-assembler = { path = "../block-assembler" }
clap = { version = "4.5", features = ["derive"] }
rigor-pool-pg = { path = "../rigor-pool-pg" }
hex = "0.4"
rigor-gbt = { path = "../rigor-gbt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
share-validator = { path = "../share-validator" }
stratum-server = { path = "../stratum-server" }
thiserror = "1.0"
toml = "0.8"

[dev-dependencies]
serde_json = "1.0"
