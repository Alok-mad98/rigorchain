[package]
name = "mint-engine"
version = "0.1.0"
edition = "2021"
description = "LEGACY audit-only RES mint builder (DETACHED from pool runtime; Option A)"
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["rigor-pool-pg/postgres", "winner-engine/postgres"]

[dependencies]
block-assembler = { path = "../block-assembler" }
rigor-convergence-root = { path = "../rigor-convergence-root" }
rigor-pool-pg = { path = "../rigor-pool-pg" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rigor-gbt = { path = "../rigor-gbt" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
rigor-pool-metrics = { path = "../shared/metrics" }
winner-engine = { path = "../winner-engine" }

[dev-dependencies]
serde_json = "1.0"
