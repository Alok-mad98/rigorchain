[package]
name = "block-assembler"
version = "0.1.0"
edition = "2021"
description = "RIGOR pool stack block assembler and JobSnapshot publisher (TASK-MINING-007)"
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["rigor-pool-pg/postgres"]

[dependencies]
hex = "0.4"
rigor-convergence-root = { path = "../rigor-convergence-root" }
rigor-gbt = { path = "../rigor-gbt" }
rigor-pool-pg = { path = "../rigor-pool-pg" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
rigor-gbt = { path = "../rigor-gbt" }
serde_json = "1.0"
