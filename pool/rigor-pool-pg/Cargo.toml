[package]
name = "rigor-pool-pg"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL persistence layer for the RIGOR pool stack (TASK-MINING-017)"
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres"]

[dependencies]
hex = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

postgres = { version = "0.19", optional = true, features = [
    "with-uuid-1",
    "with-serde_json-1",
    "with-chrono-0_4",
] }
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }
