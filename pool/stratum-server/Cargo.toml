[package]
name = "stratum-server"
version = "0.1.0"
edition = "2021"
description = "RIGOR pool Stratum v1 server and miner submission pipeline (TASK-MINING-009)"
license = "MIT"
readme = "README.md"

[features]
default = []
postgres = ["rigor-pool-pg/postgres"]

[dependencies]
block-assembler = { path = "../block-assembler" }
rigor-pool-pg = { path = "../rigor-pool-pg" }
hex = "0.4"
rigor-gbt = { path = "../rigor-gbt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
share-validator = { path = "../share-validator" }
sha2 = "0.10"
thiserror = "1.0"
rigor-pool-metrics = { path = "../shared/metrics" }

[dev-dependencies]
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
