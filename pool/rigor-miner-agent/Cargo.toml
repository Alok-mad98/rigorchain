[package]
name = "rigor-miner-agent"
version = "0.1.0"
edition = "2021"
description = "Production CPU miner agent for RIGOR pool Stratum (TASK-MINING-023)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rigor-miner-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
share-validator = { path = "../share-validator" }
rigor-pool-metrics = { path = "../shared/metrics" }

[dev-dependencies]
share-validator = { path = "../share-validator" }
block-assembler = { path = "../block-assembler" }
rigor-gbt = { path = "../rigor-gbt" }
stratum-server = { path = "../stratum-server" }
